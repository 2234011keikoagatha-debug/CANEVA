<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f8f78">
<title>Caneva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Ganti font utama di sini (mis. Etna Sans Serif bila file font sudah ada) */
  --font:'Plus Jakarta Sans',system-ui,sans-serif;
  --teal:#2f8f78; --teal-d:#1c5f4f; --green:#3fae7a; --blue:#3f74d6;
  --amber:#e0a53f; --red:#d9534f;
  --bg:#f2f6f3; --card:#fff; --ink:#16233b; --soft:#5b6b85; --line:#e3ebe5; --chip:#eaf6ee;
  --out:#cfe3d3;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1a15; --card:#17261f; --ink:#e8f1ec; --soft:#9db0a5; --line:#233a30; --chip:#1d3328; --out:#0a110d;
}}
:root[data-theme="dark"]{--bg:#0f1a15; --card:#17261f; --ink:#e8f1ec; --soft:#9db0a5; --line:#233a30; --chip:#1d3328; --out:#0a110d;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;}
body{background:var(--out);font-family:var(--font);color:var(--ink);}
button{font-family:inherit;cursor:pointer;}
#app{position:relative;max-width:480px;height:100%;height:100dvh;margin:0 auto;background:var(--bg);overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.18);}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;background-color:#2c6b45;}
/* Foto latar: taruh file di folder img/ (gradasi hijau dipakai bila file belum ada) */
.bg-splash{background-image:url(img/splash.jpg),linear-gradient(160deg,#4c8f52,#12261c);background-position:center 30%;}
.bg-home{background-image:url(img/home.jpg),linear-gradient(160deg,#4c8f52,#12261c);background-position:center 55%;}
.bg-air{background-image:url(img/detail.jpg),linear-gradient(160deg,#4c8f52,#12261c);background-position:center 60%;}
.scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,15,8,.2),rgba(5,15,8,.6));}

/* splash */
#splash{position:absolute;inset:0;z-index:20;color:#fff;display:flex;flex-direction:column;padding:0 24px calc(32px + env(safe-area-inset-bottom,0px));transition:opacity .35s;}
#splash.out{opacity:0;pointer-events:none;}
#splash .mid{position:relative;flex:1;display:flex;align-items:center;justify-content:center;}
#splash img{width:62%;max-width:240px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.35));}
#splash p{position:relative;text-align:center;font-size:14px;line-height:1.5;opacity:.92;margin:0 0 18px;}
.cta{position:relative;width:100%;border:0;border-radius:28px;padding:16px;background:var(--green);color:#fff;font-weight:700;font-size:15px;}

/* shell */
#screens{position:absolute;inset:0;}
.screen{position:absolute;inset:0;overflow-y:auto;padding-bottom:calc(86px + env(safe-area-inset-bottom,0px));display:none;scrollbar-width:none;}
.screen::-webkit-scrollbar{display:none;}
.screen.on{display:block;}
.hero{position:relative;color:#fff;padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 26px;overflow:hidden;}
.hero>*{position:relative;}
.hero>.bg,.hero>.scrim{position:absolute;}
.hero .row{display:flex;justify-content:space-between;align-items:center;}
.badge{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.25);backdrop-filter:blur(6px);display:grid;place-items:center;}
.badge img{width:24px;height:24px;object-fit:contain;}
.ava{width:40px;height:40px;border-radius:50%;border:2px solid #fff;background:linear-gradient(135deg,var(--green),var(--teal-d));display:grid;place-items:center;font-weight:800;font-size:13px;}
.hi{font-size:17px;font-weight:700;margin:18px 0 2px;}
.loc{font-size:12px;opacity:.88;margin:0 0 14px;}
.temp{display:flex;justify-content:space-between;align-items:flex-end;}
.temp b{font-size:46px;line-height:1;font-weight:800;}
.temp span{font-size:12px;text-align:right;opacity:.92;}
.chips{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.chips i{font-style:normal;background:rgba(255,255,255,.2);backdrop-filter:blur(6px);border-radius:20px;padding:6px 12px;font-size:12px;}
.sheet{position:relative;margin-top:-16px;background:var(--bg);border-radius:24px 24px 0 0;padding:20px 18px 8px;}
.page-h{padding:calc(env(safe-area-inset-top,0px) + 20px) 18px 0;}
.page-h h1{margin:0;font-size:22px;font-weight:800;}
.page-h p{margin:2px 0 0;font-size:12.5px;color:var(--soft);}
.pad{padding:14px 18px 0;}
h2{font-size:14px;margin:18px 0 10px;font-weight:700;}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.sub{font-size:12px;color:var(--soft);}
.pill{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;}
.ok{background:var(--chip);color:var(--teal);} .low{background:#fbf1de;color:#96701f;} .crit{background:#fbe7e6;color:var(--red);}
.bar{height:7px;border-radius:7px;background:var(--line);overflow:hidden;margin:9px 0;}
.bar i{display:block;height:100%;border-radius:7px;}
.bar .ok{background:var(--green);} .bar .low{background:var(--amber);} .bar .crit{background:var(--red);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.m{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;}
.m b{display:block;font-size:19px;margin-top:4px;font-weight:800;}
.m.warn{border-color:var(--amber);} .m.bad{border-color:var(--red);}
.alert{display:flex;gap:10px;padding:12px;border-radius:14px;margin-bottom:8px;font-size:12.5px;line-height:1.45;}
.alert.crit{background:#fbe7e6;color:#7d2a2a;} .alert.warn{background:#fbf1de;color:#6f5217;} .alert.good{background:var(--chip);color:var(--teal-d);}
.alert b{display:block;}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px;}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:8px 14px;font-size:12.5px;font-weight:600;white-space:nowrap;}
.tab.on{background:var(--teal);color:#fff;border-color:var(--teal);}
select,input[type=text]{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px 12px;font-family:inherit;font-size:14px;}
.btn{border:0;border-radius:14px;padding:12px 16px;background:var(--teal);color:#fff;font-weight:700;font-size:13.5px;}
.btn.ghost{background:var(--chip);color:var(--teal-d);}
.ring{position:relative;width:66px;height:66px;flex:none;}
.ring svg{transform:rotate(-90deg);} .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;}
.task{display:flex;align-items:center;gap:10px;padding:11px 12px;}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--soft);background:none;flex:none;color:#fff;font-size:13px;line-height:1;}
.chk.on{background:var(--teal);border-color:var(--teal);}
.task.done span{text-decoration:line-through;color:var(--soft);}
.x{margin-left:auto;border:0;background:none;color:var(--soft);font-size:18px;}
.chart{display:flex;align-items:flex-end;gap:8px;height:120px;}
.chart div{flex:1;text-align:center;font-size:10.5px;color:var(--soft);}
.chart i{display:block;background:var(--blue);border-radius:6px 6px 0 0;margin-bottom:5px;}
.chart .t i{background:var(--green);}
#nav{position:absolute;left:0;right:0;bottom:0;z-index:10;display:flex;background:var(--card);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));}
#nav button{flex:1;border:0;background:none;color:var(--soft);font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;}
#nav button[aria-current=page]{color:var(--teal);}
#nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
#toast{position:absolute;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:12.5px;opacity:0;pointer-events:none;transition:.25s;z-index:30;white-space:nowrap;}
#toast.on{opacity:1;transform:translate(-50%,0);}
.foot{font-size:11px;color:var(--soft);text-align:center;padding:14px 18px 0;}
</style>
</head>
<body>
<div id="app">
  <section id="splash">
    <div class="bg bg-splash"></div><div class="scrim"></div>
    <div class="mid"><img alt="Caneva" src="img/logo-full.png"></div>
    <p>Pemantauan air &amp; irigasi cerdas untuk lahan yang lebih produktif.</p>
    <button class="cta" id="start">Mulai</button>
  </section>

  <div id="screens">
    <section class="screen" id="s-home"></section>
    <section class="screen" id="s-air"></section>
    <section class="screen" id="s-lahan"></section>
    <section class="screen" id="s-tugas"></section>
    <section class="screen" id="s-insight"></section>
  </div>
  <nav id="nav" aria-label="Navigasi utama"></nav>
  <div id="toast" role="status"></div>
</div>

<script>
/* ===== KONFIGURASI DATA =====
   Data di bawah adalah DATA CONTOH. Untuk memakai data sensor asli, isi ulang
   objek DATA dari server/ESP32 Anda (mis. lewat fetch()) lalu panggil renderAll(). */
const DATA={
  user:'Budi', loc:'Sawojajar, Jawa Timur',
  weather:{temp:26,cond:'Cerah',wind:5,hum:42.5,feels:12},
  efficiency:75, health:72,
  units:[
    {id:'AWG 01',level:72,ph:6.8,tds:45,temp:27.3,prod:[3.1,4.0,2.8,4.6,3.9,5.2,6.2]},
    {id:'AWG 02',level:54,ph:6.5,tds:62,temp:28.1,prod:[2.5,3.2,3.0,3.8,3.1,4.4,7.1]},
    {id:'AWG 03',level:17,ph:7.1,tds:48,temp:26.7,prod:[2.0,2.6,2.2,3.0,2.7,3.5,5.1]}
  ],
  crops:{Tomat:[5.5,6.5],Padi:[5.5,7.0],Cabai:[6.0,7.0],Selada:[5.5,6.5]},
  fields:[
    {name:'Sawah Blok A',crop:'Padi',moist:75,N:'Tinggi',P:'Baik',K:'Rendah',ph:6.5},
    {name:'Greenhouse 1',crop:'Tomat',moist:62,N:'Baik',P:'Baik',K:'Baik',ph:6.2},
    {name:'Kebun Cabai',crop:'Cabai',moist:41,N:'Rendah',P:'Baik',K:'Baik',ph:6.8}
  ],
  days:['Sen','Sel','Rab','Kam','Jum','Sab','Min']
};
const TABS=[['home','Beranda','M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z'],
 ['air','Air','M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z'],
 ['lahan','Lahan','M5 19c0-8 5-14 15-14 0 10-6 15-14 15M5 19l7-7'],
 ['tugas','Tugas','M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01'],
 ['insight','Insight','M4 20V10M10 20V4M16 20v-8M22 20H2']];
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const store={get(k,d){try{const v=localStorage.getItem('caneva:'+k);return v?JSON.parse(v):d}catch(e){return d}},
             set(k,v){try{localStorage.setItem('caneva:'+k,JSON.stringify(v))}catch(e){}}};
const S={unit:0,crop:store.get('crop','Tomat'),tasks:store.get('tasks',[
  {t:'Cek filter AWG 02',done:false},{t:'Tambah pH Down ke AWG 01',done:false},{t:'Catat hasil panen Blok A',done:true}])};
const sts=l=>l>=60?{k:'ok',t:'Tersedia'}:l>=30?{k:'low',t:'Rendah'}:{k:'crit',t:'Kritis'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=a=>a.reduce((x,y)=>x+y,0), fmt=n=>n.toFixed(1).replace('.',',');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),1800);}
function ring(p,c='var(--green)'){const r=27,L=2*Math.PI*r;return `<div class="ring"><svg width="66" height="66" viewBox="0 0 66 66"><circle cx="33" cy="33" r="${r}" fill="none" stroke="var(--line)" stroke-width="7"/><circle cx="33" cy="33" r="${r}" fill="none" stroke="${c}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="${L*(1-p/100)}"/></svg><b>${p}%</b></div>`;}
function alerts(){const a=[],r=DATA.crops[S.crop];
  DATA.units.forEach(u=>{const s=sts(u.level);
    if(s.k!=='ok')a.push({k:s.k==='crit'?'crit':'warn',t:`${u.id} level air ${s.t.toLowerCase()}`,d:`Tersisa ${u.level}%`});
    if(u.ph>r[1]||u.ph<r[0])a.push({k:'warn',t:`pH ${u.id} di luar target`,d:`pH ${u.ph} (target ${r[0]}–${r[1]} untuk ${S.crop})`});});
  return a;}
const alertHTML=a=>a.length?a.map(x=>`<div class="alert ${x.k}"><div><b>${esc(x.t)}</b>${esc(x.d)}</div></div>`).join(''):`<div class="alert good"><div><b>Semua normal</b>Seluruh sensor berfungsi baik.</div></div>`;

function rHome(){const w=DATA.weather,U=DATA.units,tot=sum(U.map(u=>u.level)),today=sum(U.map(u=>u.prod[6]));
$('#s-home').innerHTML=`<div class="hero"><div class="bg bg-home"></div><div class="scrim"></div>
 <div class="row"><div class="badge"><img alt="Caneva" src="img/logo-icon.png"></div><div class="ava">${esc(DATA.user.slice(0,2).toUpperCase())}</div></div>
 <p class="hi">Hai, ${esc(DATA.user)}</p><p class="loc">${esc(DATA.loc)}</p>
 <div class="temp"><b>${w.temp}°C</b><span>${w.cond}<br>${new Date().toLocaleDateString('id-ID',{day:'numeric',month:'short'})}</span></div>
 <div class="chips"><i>Angin ${w.wind} km/j</i><i>Lembap ${fmt(w.hum)}%</i></div></div>
 <div class="sheet">
  <div class="grid2"><div class="m"><span class="sub">Total air</span><b>${tot} L</b></div><div class="m"><span class="sub">Produksi hari ini</span><b>${fmt(today)} L</b></div></div>
  <h2>Efisiensi air</h2><div class="card"><div class="row"><span class="sub">Penggunaan air terhadap target</span><span class="pill ok">Tinggi</span></div><div class="bar"><i class="ok" style="width:${DATA.efficiency}%"></i></div><b>${DATA.efficiency}%</b></div>
  <h2>Status AWG</h2>${DATA.units.map((u,i)=>{const s=sts(u.level);return `<div class="card" data-go="air" data-u="${i}" style="cursor:pointer"><div class="row"><b>${u.id}</b><span class="pill ${s.k}">${s.t}</span></div><div class="bar"><i class="${s.k}" style="width:${u.level}%"></i></div><div class="sub">pH ${u.ph} · TDS ${u.tds} ppm · ${fmt(u.temp)}°C</div></div>`}).join('')}
  <h2>Peringatan</h2>${alertHTML(alerts())}</div>`;}

function rAir(){const u=DATA.units[S.unit],r=DATA.crops[S.crop],phBad=u.ph>r[1]||u.ph<r[0];
 const tone=(ok,w)=>ok?'':w?'warn':'bad', s=sts(u.level);
 let rec=phBad?(u.ph>r[1]?['pH terlalu tinggi','Tambahkan pH Down secukupnya sebelum air dipakai mengairi '+S.crop+'.']:['pH terlalu rendah','Tambahkan pH Up sebelum air dipakai mengairi '+S.crop+'.']):['Air siap dipakai','Kualitas air sesuai target '+S.crop+'.'];
$('#s-air').innerHTML=`<div class="hero"><div class="bg bg-air"></div><div class="scrim"></div><h1 style="margin:0;font-size:22px">Kualitas air</h1><p class="loc" style="margin:2px 0 0">Pantau tiap unit AWG</p></div>
 <div class="sheet"><div class="tabs">${DATA.units.map((x,i)=>`<button class="tab ${i===S.unit?'on':''}" data-unit="${i}">${x.id}</button>`).join('')}</div>
  <div class="card row">${ring(u.level,`var(--${s.k==='ok'?'green':s.k==='low'?'amber':'red'})`)}<div style="flex:1"><b>Volume tangki</b><div class="sub">${u.level} L dari 100 L</div></div><span class="pill ${s.k}">${s.t}</span></div>
  <div class="grid2">
   <div class="m ${tone(!phBad,1)}"><span class="sub">pH</span><b>${u.ph}</b></div>
   <div class="m ${tone(u.tds<200,1)}"><span class="sub">TDS / EC</span><b>${u.tds} ppm</b></div>
   <div class="m ${tone(u.temp>=20&&u.temp<=30,1)}"><span class="sub">Suhu air</span><b>${fmt(u.temp)}°C</b></div>
   <div class="m"><span class="sub">Produksi hari ini</span><b>${fmt(u.prod[6])} L</b></div></div>
  <h2>Rekomendasi irigasi</h2><div class="card">
   <label class="sub" for="crop">Tanaman</label><select id="crop">${Object.keys(DATA.crops).map(c=>`<option ${c===S.crop?'selected':''}>${c}</option>`).join('')}</select>
   <div class="row" style="margin:12px 0"><span class="sub">Target pH</span><b>${r[0]} – ${r[1]}</b></div>
   <div class="alert ${phBad?'warn':'good'}" style="margin:0"><div><b>${rec[0]}</b>${rec[1]}</div></div></div></div>`;}

function rLahan(){$('#s-lahan').innerHTML=`<div class="page-h"><h1>Lahan</h1><p>Kelembapan &amp; status tanah</p></div><div class="pad">
 ${DATA.fields.map((f,i)=>{const c=f.moist<45?'var(--amber)':'var(--green)',pc=v=>v==='Rendah'?'crit':v==='Tinggi'||v==='Baik'?'ok':'low';
 return `<div class="card"><div class="row" style="justify-content:flex-start;gap:14px">${ring(f.moist,c)}<div style="flex:1"><b>${esc(f.name)}</b><div class="sub">${esc(f.crop)} · pH tanah ${f.ph}</div></div></div>
 <div class="row" style="margin:12px 0"><span class="sub">Nitrogen</span><span class="pill ${pc(f.N)}">${f.N}</span></div>
 <div class="row" style="margin:12px 0"><span class="sub">Fosfor</span><span class="pill ${pc(f.P)}">${f.P}</span></div>
 <div class="row" style="margin:12px 0"><span class="sub">Kalium</span><span class="pill ${pc(f.K)}">${f.K}</span></div>
 <button class="btn ghost" data-water="${i}" style="width:100%">Catat penyiraman</button></div>`}).join('')}</div>`;}

function rTugas(){const open=S.tasks.filter(t=>!t.done).length;
$('#s-tugas').innerHTML=`<div class="page-h"><h1>Tugas</h1><p>${open} belum selesai</p></div><div class="pad">
 <div class="row" style="margin-bottom:12px"><input type="text" id="newTask" placeholder="Tambah tugas…" maxlength="80"><button class="btn" id="addTask">Tambah</button></div>
 ${S.tasks.length?S.tasks.map((t,i)=>`<div class="card task ${t.done?'done':''}" style="padding:0"><div class="task" style="width:100%"><button class="chk ${t.done?'on':''}" data-t="${i}" aria-label="Selesai">${t.done?'✓':''}</button><span>${esc(t.t)}</span><button class="x" data-d="${i}" aria-label="Hapus">×</button></div></div>`).join(''):'<p class="sub">Belum ada tugas.</p>'}</div>`;}

function rInsight(){const p=DATA.days.map((_,d)=>sum(DATA.units.map(u=>u.prod[d]))),mx=Math.max(...p),best=[...DATA.units].sort((a,b)=>sum(b.prod)-sum(a.prod))[0];
$('#s-insight').innerHTML=`<div class="page-h"><h1>Insight</h1><p>Produksi air 7 hari terakhir</p></div><div class="pad">
 <div class="grid2"><div class="m"><span class="sub">Total 7 hari</span><b>${fmt(sum(p))} L</b></div><div class="m"><span class="sub">Rata-rata/hari</span><b>${fmt(sum(p)/7)} L</b></div></div>
 <h2>Produksi harian (L)</h2><div class="card"><div class="chart">${p.map((v,i)=>`<div class="${i===6?'t':''}"><i style="height:${Math.round(v/mx*90)}px"></i>${DATA.days[i]}</div>`).join('')}</div></div>
 <div class="card"><div class="row"><span class="sub">Unit paling produktif</span><b>${best.id}</b></div></div>
 <p class="foot">Data contoh — sambungkan ke sensor untuk data real-time.</p></div>`;}

function renderAll(){rHome();rAir();rLahan();rTugas();rInsight();}
function show(tab){$$('.screen').forEach(s=>s.classList.toggle('on',s.id==='s-'+tab));
  $$('#nav button').forEach(b=>b.dataset.tab===tab?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
  $('#s-'+tab).scrollTop=0;}
$('#nav').innerHTML=TABS.map(t=>`<button data-tab="${t[0]}"><svg viewBox="0 0 24 24"><path d="${t[2]}"/></svg>${t[1]}</button>`).join('');
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(b.dataset.tab);});
$('#screens').addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){S.unit=+g.dataset.u;rAir();show('air');return;}
  const u=e.target.closest('[data-unit]');if(u){S.unit=+u.dataset.unit;rAir();return;}
  const w=e.target.closest('[data-water]');if(w){const f=DATA.fields[+w.dataset.water];S.tasks.unshift({t:'Siram '+f.name,done:true});store.set('tasks',S.tasks);rTugas();toast('Penyiraman dicatat');return;}
  const t=e.target.closest('[data-t]');if(t){const x=S.tasks[+t.dataset.t];x.done=!x.done;store.set('tasks',S.tasks);rTugas();return;}
  const d=e.target.closest('[data-d]');if(d){S.tasks.splice(+d.dataset.d,1);store.set('tasks',S.tasks);rTugas();return;}
  if(e.target.id==='addTask')addTask();});
$('#screens').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='newTask')addTask();});
$('#screens').addEventListener('change',e=>{if(e.target.id==='crop'){S.crop=e.target.value;store.set('crop',S.crop);rAir();rHome();}});
function addTask(){const i=$('#newTask'),v=i.value.trim();if(!v)return;S.tasks.unshift({t:v,done:false});store.set('tasks',S.tasks);rTugas();}
$('#start').addEventListener('click',()=>{store.set('started',1);$('#splash').classList.add('out');setTimeout(()=>$('#splash').remove(),400);});
renderAll();show('home');
if(store.get('started',0))$('#splash').remove();
</script>
</body>
</html>
